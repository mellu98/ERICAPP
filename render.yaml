services:
  - type: web
    name: ericapp-parser
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MEDICAL_PARSER_MODEL
        value: gpt-5.4
      - key: PORT
        value: 10000

  - type: web
    name: ericapp-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
