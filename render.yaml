services:
  - type: web
    name: ericapp-parser
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MEDICAL_PARSER_MODEL
        value: gpt-5.4
      - key: OPENAI_FAMILY_ASSISTANT_MODEL
        value: gpt-5.4
      - key: CORS_ORIGIN
        value: http://localhost:5173,https://ericapp-web.onrender.com
      - key: PORT
        value: 10000

  - type: web
    name: ericapp-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ericapp-parser.onrender.com
